<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>geoGlobe3D 高级示例 - 图形、图层、工具</title>
  <link rel="stylesheet" href="../dist/Widgets/widgets.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #mapContainer { width: 100%; height: 100%; overflow: hidden; }
    
    #toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(30, 30, 30, 0.9);
      padding: 15px;
      border-radius: 8px;
      color: white;
      font-family: Arial, sans-serif;
      max-width: 320px;
    }
    
    #toolbar h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #4CAF50;
      border-bottom: 1px solid #444;
      padding-bottom: 8px;
    }
    
    .section {
      margin-bottom: 15px;
    }
    
    .section-title {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 8px;
      font-weight: bold;
    }
    
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 12px;
      margin: 3px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 11px;
      transition: background 0.3s;
    }
    
    button:hover {
      background: #45a049;
    }
    
    button:active {
      background: #3d8b40;
    }
    
    button.secondary {
      background: #2196F3;
    }
    
    button.secondary:hover {
      background: #0b7dda;
    }
    
    button.danger {
      background: #f44336;
    }
    
    button.danger:hover {
      background: #da190b;
    }
    
    #info {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #4CAF50;
      padding: 10px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      max-width: 400px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="mapContainer"></div>
  
  <div id="toolbar">
    <h3>🌍 geoGlobe3D 高级功能演示</h3>
    
    <div class="section">
      <div class="section-title">📍 图形绘制</div>
      <button onclick="addPoint()">添加点</button>
      <button onclick="addBillboard()">添加广告牌</button>
      <button onclick="addLabel()">添加标签</button>
      <button onclick="addPolyline()">添加折线</button>
      <button onclick="addPolygon()">添加面</button>
      <button onclick="addCircle()">添加圆</button>
      <button onclick="addModel()">添加模型</button>
      <button class="danger" onclick="clearGraphics()">清除图形</button>
    </div>
    
    <div class="section">
      <div class="section-title">📐 量算工具</div>
      <button class="secondary" onclick="measureDistance()">距离量算</button>
      <button class="secondary" onclick="measureArea()">面积量算</button>
      <button class="secondary" onclick="measureHeight()">高度量算</button>
      <button class="danger" onclick="clearMeasure()">清除量算</button>
    </div>
    
    <div class="section">
      <div class="section-title">✏️ 绘制工具</div>
      <button class="secondary" onclick="drawPoint()">绘制点</button>
      <button class="secondary" onclick="drawPolyline()">绘制线</button>
      <button class="secondary" onclick="drawPolygon()">绘制面</button>
      <button class="secondary" onclick="drawCircle()">绘制圆</button>
      <button class="danger" onclick="clearDraw()">清除绘制</button>
    </div>
    
    <div class="section">
      <div class="section-title">🗺️ 图层管理</div>
      <button onclick="add3DTiles()">加载 3D Tiles</button>
      <button onclick="addGeoJson()">加载 GeoJSON</button>
      <button onclick="toggleTerrain()">切换地形</button>
    </div>
  </div>
  
  <div id="info">提示: 右键结束量算/绘制</div>
  
  <script src="../dist/geoglobe.min.js"></script>
  <script>
    // 初始化地图
    const map = new geoGlobe.GeoMap('mapContainer', {
      scene: {
        globe: {
          enableLighting: true,
        }
      },
      camera: {
        position: [116.39, 39.91, 15000000],
        heading: 0,
        pitch: -90,
        roll: 0
      }
    });
    
    // 创建图层
    const graphicLayer = new geoGlobe.GraphicLayer({
      name: '图形图层'
    }).addTo(map);
    
    // 创建工具
    const measure = new geoGlobe.Measure(map);
    const draw = new geoGlobe.Draw(map);
    
    // 图形计数器
    let pointCount = 0;
    let tilesetLayer = null;
    
    // 添加点
    function addPoint() {
      const lon = 116.39 + (Math.random() - 0.5) * 2;
      const lat = 39.91 + (Math.random() - 0.5) * 2;
      
      const point = new geoGlobe.PointGraphic({
        position: [lon, lat, 100000],
        style: {
          pixelSize: 12,
          color: '#ff0000',
          outlineColor: '#ffffff',
          outlineWidth: 2
        },
        attr: { id: ++pointCount }
      });
      
      graphicLayer.addGraphic(point);
      showInfo(`添加点 #${pointCount} (${lon.toFixed(2)}, ${lat.toFixed(2)})`);
    }
    
    // 添加广告牌
    function addBillboard() {
      const lon = 116.39 + (Math.random() - 0.5) * 2;
      const lat = 39.91 + (Math.random() - 0.5) * 2;
      
      const billboard = new geoGlobe.BillboardGraphic({
        position: [lon, lat, 100000],
        style: {
          image: 'https://cesium.com/downloads/cesiumjs/releases/1.137/Build/Cesium/Widgets/Images/NavigationHelp/MouseLeft.svg',
          scale: 1.5,
          color: '#00ff00'
        }
      });
      
      graphicLayer.addGraphic(billboard);
      showInfo(`添加广告牌 (${lon.toFixed(2)}, ${lat.toFixed(2)})`);
    }
    
    // 添加标签
    function addLabel() {
      const lon = 116.39 + (Math.random() - 0.5) * 2;
      const lat = 39.91 + (Math.random() - 0.5) * 2;
      
      const label = new geoGlobe.LabelGraphic({
        position: [lon, lat, 100000],
        style: {
          text: '这是一个标签',
          font: '16px sans-serif',
          fillColor: '#ffffff',
          outlineColor: '#000000',
          outlineWidth: 2,
          style: 'fillAndOutline',
          showBackground: true,
          backgroundColor: 'rgba(0,0,0,0.7)'
        }
      });
      
      graphicLayer.addGraphic(label);
      showInfo(`添加标签 (${lon.toFixed(2)}, ${lat.toFixed(2)})`);
    }
    
    // 添加折线
    function addPolyline() {
      const positions = [
        [116.2, 39.8, 50000],
        [116.4, 40.0, 50000],
        [116.6, 39.9, 50000],
        [116.8, 40.1, 50000]
      ];
      
      const polyline = new geoGlobe.PolylineGraphic({
        positions,
        style: {
          width: 5,
          material: {
            type: 'color',
            color: '#ffff00'
          }
        }
      });
      
      graphicLayer.addGraphic(polyline);
      showInfo(`添加折线 (${positions.length} 个点)`);
    }
    
    // 添加多边形
    function addPolygon() {
      const positions = [
        [116.3, 39.8, 0],
        [116.5, 39.8, 0],
        [116.5, 40.0, 0],
        [116.3, 40.0, 0]
      ];
      
      const polygon = new geoGlobe.PolygonGraphic({
        positions,
        style: {
          color: 'rgba(255, 0, 0, 0.5)',
          outline: true,
          outlineColor: '#ff0000',
          outlineWidth: 3
        }
      });
      
      graphicLayer.addGraphic(polygon);
      showInfo(`添加多边形 (${positions.length} 个顶点)`);
    }
    
    // 添加圆
    function addCircle() {
      const lon = 116.39 + (Math.random() - 0.5) * 2;
      const lat = 39.91 + (Math.random() - 0.5) * 2;
      
      const circle = new geoGlobe.CircleGraphic({
        position: [lon, lat, 0],
        style: {
          radius: 100000,
          color: 'rgba(0, 255, 0, 0.3)',
          outline: true,
          outlineColor: '#00ff00',
          outlineWidth: 2
        }
      });
      
      graphicLayer.addGraphic(circle);
      showInfo(`添加圆 (半径: 100km)`);
    }
    
    // 添加模型
    function addModel() {
      const lon = 116.39;
      const lat = 39.91;
      
      const model = new geoGlobe.ModelGraphic({
        position: [lon, lat, 0],
        style: {
          uri: 'https://assets.cesium.com/models/CesiumMilkTruck/CesiumMilkTruck.glb',
          scale: 500,
          minimumPixelSize: 64,
          color: '#00ffff'
        }
      });
      
      graphicLayer.addGraphic(model);
      showInfo(`添加 glTF 模型 (${lon.toFixed(2)}, ${lat.toFixed(2)})`);
    }
    
    // 清除图形
    function clearGraphics() {
      graphicLayer.clear();
      pointCount = 0;
      showInfo('已清除所有图形');
    }
    
    // 距离量算
    async function measureDistance() {
      showInfo('距离量算: 左键添加点，右键结束');
      const result = await measure.distance();
      showInfo(`距离: ${result.distance.toFixed(2)} m (${result.positions.length} 个点)`);
    }
    
    // 面积量算
    async function measureArea() {
      showInfo('面积量算: 左键添加点，右键结束');
      const result = await measure.area();
      showInfo(`面积: ${result.area.toFixed(2)} m²`);
    }
    
    // 高度量算
    async function measureHeight() {
      showInfo('高度量算: 左键选择点');
      const result = await measure.height();
      showInfo(`高度: ${result.height.toFixed(2)} m`);
    }
    
    // 清除量算
    function clearMeasure() {
      measure.clear();
      showInfo('已清除量算结果');
    }
    
    // 绘制点
    async function drawPoint() {
      showInfo('绘制点: 左键点击位置');
      const result = await draw.point({ pixelSize: 10, color: '#ff0000' });
      showInfo(`绘制点完成 (${result.position[0].toFixed(2)}, ${result.position[1].toFixed(2)})`);
    }
    
    // 绘制线
    async function drawPolyline() {
      showInfo('绘制折线: 左键添加点，右键结束');
      const result = await draw.polyline({ width: 4, color: '#0000ff' });
      showInfo(`绘制折线完成 (${result.positions.length} 个点)`);
    }
    
    // 绘制面
    async function drawPolygon() {
      showInfo('绘制多边形: 左键添加点，右键结束');
      const result = await draw.polygon({ color: '#ff00ff', outlineColor: '#ff00ff' });
      showInfo(`绘制多边形完成 (${result.positions.length} 个顶点)`);
    }
    
    // 绘制圆
    async function drawCircle() {
      showInfo('绘制圆: 第一次点击确定圆心，第二次点击确定半径');
      const result = await draw.circle({ color: '#00ffff', outlineColor: '#00ffff' });
      showInfo(`绘制圆完成 (半径: ${result.radius.toFixed(2)} m)`);
    }
    
    // 清除绘制
    function clearDraw() {
      draw.clear();
      showInfo('已清除绘制结果');
    }
    
    // 加载 3D Tiles
    function add3DTiles() {
      if (tilesetLayer) {
        map.removeLayer(tilesetLayer);
        tilesetLayer = null;
      }
      tilesetLayer = new geoGlobe.TilesetLayer({
        name: '3D Tiles 示例',
        ionAssetId: 2275207,          // Cesium Ion 全球 OSM 建筑（需要 Ion Token）
        maximumScreenSpaceError: 16,
        onReady: () => {
          tilesetLayer.flyTo();       // 加载完成后飞行定位
          showInfo('3D Tiles 加载完成，已飞行定位');
        }
      });
      map.addLayer(tilesetLayer);
      showInfo('正在加载 3D Tiles（需要 Cesium Ion Token）...');
    }
    
    let geojsonLayer = null;

    // 加载 GeoJSON
    function addGeoJson() {
      if (geojsonLayer) {
        map.removeLayer(geojsonLayer);
        geojsonLayer = null;
      }
      geojsonLayer = new geoGlobe.GeoJsonLayer({
        name: 'GeoJSON 地震数据',
        url: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.geojson',
        stroke: '#ff0000',
        strokeWidth: 2,
        fill: 'rgba(255, 0, 0, 0.3)',
        markerColor: '#ff0000',
        onLoad: () => {
          geojsonLayer.flyTo();
          showInfo('GeoJSON 加载完成（最近一月全球地震）');
        }
      });
      map.addLayer(geojsonLayer);
      showInfo('正在加载 GeoJSON 地震数据...');
    }
    
    // 切换地形
    let terrainEnabled = false;
    let terrainLayer = null;

    function toggleTerrain() {
      if (!terrainEnabled) {
        terrainLayer = new geoGlobe.TerrainLayer({
          name: 'Cesium World Terrain',
          type: 'ion',
          ionAssetId: 1,                // Cesium Ion 地形 (Asset ID 1 = Cesium World Terrain)
          requestVertexNormals: true,   // 请求法线以支持光照
          requestWaterMask: true        // 请求水面蒙版
        });
        map.addLayer(terrainLayer);
        showInfo('已启用 Cesium World Terrain');
      } else {
        if (terrainLayer) {
          map.removeLayer(terrainLayer);
          terrainLayer = null;
        }
        showInfo('已禁用地形（平坦椭球体）');
      }
      terrainEnabled = !terrainEnabled;
    }
    
    // 显示信息
    function showInfo(text) {
      document.getElementById('info').textContent = text;
    }
    
    // 事件管理器示例
    const eventManager = new geoGlobe.EventManager(map);
    
    eventManager.on('leftClick', (e) => {
      if (e.entity) {
        const graphic = graphicLayer.getGraphics().find(g => g.entity === e.entity);
        if (graphic) {
          console.log('点击图形:', graphic.id, graphic.attr);
        }
      }
    });
    
    // 初始化提示
    showInfo('geoGlobe3D 已就绪 ✓');
  </script>
</body>
</html>
