<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>海拔测试</title>
  <link rel="stylesheet" href="../lib/Widgets/widgets.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #mapContainer { width: 100%; height: 100%; overflow: hidden; }

    #panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(20, 24, 30, 0.92);
      border-radius: 8px;
      padding: 12px 16px;
      color: #ccc;
      font-size: 13px;
      font-family: 'Consolas', 'Microsoft YaHei', monospace;
      box-shadow: 0 2px 12px rgba(0,0,0,.5);
      min-width: 260px;
    }
    #panel h3 {
      font-size: 14px;
      color: #4fc3f7;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      padding-bottom: 6px;
    }
    .loc-btn {
      display: block;
      width: 100%;
      background: #2a3040;
      color: #ddd;
      border: 1px solid rgba(255,255,255,.1);
      padding: 7px 10px;
      margin-bottom: 6px;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      font-family: inherit;
      transition: background .15s;
    }
    .loc-btn:hover { background: #3a7ec8; color: #fff; }
    .loc-btn .tag {
      display: inline-block;
      background: rgba(79,195,247,.2);
      color: #4fc3f7;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 11px;
      margin-right: 6px;
    }
    .loc-btn .alt-hint {
      float: right;
      color: #888;
      font-size: 11px;
    }

    #info {
      margin-top: 10px;
      border-top: 1px solid rgba(255,255,255,.08);
      padding-top: 8px;
      font-size: 12px;
      line-height: 1.8;
      color: #aaa;
    }
    #info span { color: #4fc3f7; }
  </style>
</head>
<body>
  <div id="mapContainer"></div>

  <div id="panel">
    <h3>📍 海拔测试 — 飞往典型地点</h3>

    <button class="loc-btn" onclick="fly('everest')">
      <span class="tag">高原</span>珠穆朗玛峰
      <span class="alt-hint">~8849m</span>
    </button>
    <button class="loc-btn" onclick="fly('turpan')">
      <span class="tag">低洼</span>吐鲁番盆地
      <span class="alt-hint">~-154m</span>
    </button>
    <button class="loc-btn" onclick="fly('deadsea')">
      <span class="tag">低洼</span>死海
      <span class="alt-hint">~-430m</span>
    </button>
    <button class="loc-btn" onclick="fly('canyon')">
      <span class="tag">峡谷</span>科罗拉多大峡谷
      <span class="alt-hint">~2000m</span>
    </button>
    <button class="loc-btn" onclick="fly('plain')">
      <span class="tag">平原</span>华北平原
      <span class="alt-hint">~50m</span>
    </button>

    <div id="info">
      鼠标悬停地图查看底部状态栏海拔数值<br>
      地形：<span id="terrainStatus">加载中...</span>
    </div>
  </div>

  <script src="../lib/geoglobe.min.js"></script>
  <script>
    const map = new geoGlobe.GeoMap('mapContainer', {
      terrain: {
        enabled: false   // 先用平地初始化，下方手动加载不需要 token 的 ArcGIS 地形
      },
      scene: {
        globe: {
          depthTestAgainstTerrain: true
        }
      },
      control: {
        timeline:             false,
        animation:            false,
        baseLayerPicker:      false,
        homeButton:           false,
        sceneModePicker:      false,
        navigationHelpButton: false,
        fullscreenButton:     false,
        toolbar: true,
        navBar:  true,
        navigation: false
      },
      camera: {
        position: [86.9505, 26.3405, 3337],
        heading: 1,
        pitch: -1
      }
    });

    // 使用 ArcGIS 公共地形服务（无需 Ion token）
    const viewer = map.viewer;
    map.setTerrain({
      url: 'https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer',
      type: 'arcgis'
    }).then(() => {
      document.getElementById('terrainStatus').textContent = '✅ ArcGIS 地形已加载';
    }).catch(e => {
      document.getElementById('terrainStatus').textContent = '❌ 加载失败：' + e.message;
    });

    // 提前声明，避免 onclick 调用时 LOCATIONS 未初始化
    const LOCATIONS = {
      everest:  { pos: [86.925,  27.988,   8000], pitch: -20, label: '珠穆朗玛峰 (~8849m)' },
      turpan:   { pos: [89.18,   42.93,    3000], pitch: -15, label: '吐鲁番盆地 (~-154m)' },
      deadsea:  { pos: [35.55,   31.5,     2000], pitch: -15, label: '死海 (~-430m)' },
      canyon:   { pos: [-112.1,  36.1,     4000], pitch: -20, label: '科罗拉多大峡谷 (~2000m)' },
      plain:    { pos: [116.5,   39.5,     3000], pitch: -20, label: '华北平原 (~50m)' }
    };

    function fly(key) {
      const loc = LOCATIONS[key];
      if (!loc) return;
      map.flyTo(loc.pos, { pitch: loc.pitch, duration: 2 });
    }
  </script>
</body>
</html>
