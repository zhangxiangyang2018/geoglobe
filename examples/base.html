<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geoGlobe3D 基础示例 - Toolbar + 工具栏</title>
  <link rel="stylesheet" href="../dist/Widgets/widgets.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #mapContainer { width: 100%; height: 100%; overflow: hidden; }

    /* ── 顶部工具栏 ── */
    #toolbars {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      max-width: calc(100% - 20px);
    }

    .bar-group {
      background: rgba(24, 28, 36, 0.92);
      border-radius: 6px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
    }

    .bar-group .group-label {
      font-size: 11px;
      color: #888;
      margin-right: 4px;
      white-space: nowrap;
      user-select: none;
    }

    .bar-group button {
      background: #3a3f4b;
      color: #ddd;
      border: 1px solid rgba(255,255,255,.08);
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      transition: background .2s, color .2s;
    }

    .bar-group button:hover {
      background: #4a90d9;
      color: #fff;
    }

    .bar-group button:active {
      background: #3b7ac2;
    }

    .bar-group button.active {
      background: #4a90d9;
      color: #fff;
      border-color: #4a90d9;
    }

    .bar-group button.danger {
      color: #f06;
    }

    .bar-group button.danger:hover {
      background: #d32f2f;
      color: #fff;
    }

    /* ── 提示条 ── */
    #tip {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      background: rgba(0,0,0,.75);
      color: #4fc3f7;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 4px;
      pointer-events: none;
      transition: opacity .3s;
      opacity: 0;
      white-space: nowrap;
      font-family: 'Microsoft YaHei', sans-serif;
    }

    #tip.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="mapContainer"></div>

  <!-- 顶部功能工具栏 -->
  <div id="toolbars">
    <!-- 绘制工具 -->
    <div class="bar-group">
      <span class="group-label">✏️ 绘制</span>
      <button onclick="doDraw('point')"    title="左键点击放置点">点</button>
      <button onclick="doDraw('polyline')" title="左键添加节点, 右键结束">线</button>
      <button onclick="doDraw('polygon')"  title="左键添加节点, 右键结束">面</button>
      <button onclick="doDraw('rectangle')" title="两次点击确定对角">矩形</button>
      <button onclick="doDraw('circle')"   title="点击确定圆心, 再点击确定半径">圆</button>
      <button class="danger" onclick="clearDraw()" title="清除所有绘制结果">✕</button>
    </div>

    <!-- 量算工具 -->
    <div class="bar-group">
      <span class="group-label">📐 量算</span>
      <button onclick="doMeasure('distance')" title="左键添加节点, 右键结束">距离</button>
      <button onclick="doMeasure('area')"     title="左键添加节点, 右键结束">面积</button>
      <button onclick="doMeasure('height')"   title="左键点击选取">高度</button>
      <button class="danger" onclick="clearMeasure()" title="清除所有量算结果">✕</button>
    </div>

    <!-- 底部状态栏开关 -->
    <div class="bar-group">
      <span class="group-label">🔧 控件</span>
      <button id="btnToolbar" onclick="toggleToolbar()" title="切换底部状态栏">状态栏</button>
    </div>

    <!-- 星空控制 -->
    <div class="bar-group">
      <span class="group-label">🌌 星空</span>
      <button id="btnSkyAnim" onclick="toggleSkyAnimation()" title="开启/关闭星星闪烁动画">闪烁</button>
      <button onclick="setSkySpeed('slow')" title="缓慢闪烁">慢</button>
      <button onclick="setSkySpeed('normal')" title="正常闪烁">中</button>
      <button onclick="setSkySpeed('fast')" title="快速闪烁">快</button>
      <button id="btnMeteor" onclick="toggleMeteor()" title="开启/关闭流星效果">☄️ 流星</button>
    </div>
  </div>

  <!-- 操作提示 -->
  <div id="tip"></div>

  <script src="../dist/geoglobe.min.js"></script>
  <script>
    /* =============================================
     *  1. 初始化地图（启用底部 Toolbar 状态栏）
     * ============================================= */
    const map = new geoGlobe.GeoMap('mapContainer', {
      skyBox: 'space',      // 'space'(程序化太空) | 'default'(Cesium原生) | false(关闭)
      control: {
        timeline: false,
        animation: false,
        baseLayerPicker: false,
        homeButton: false,
        sceneModePicker: false,
        navigationHelpButton: false,
        fullscreenButton: false,
        toolbar: true,          // 底部状态栏: 经纬度 / 投影坐标 / 海拔 / 层级 / 方向 / 俯仰角 / 视高 / FPS
        navBar: true,           // 左侧导航栏：罗盘 + 复位 + 2D/3D + 放大/缩小
        navigation: false       // 已用 navBar 替代
      },
      camera: {
        position: [116.39, 39.91, 8000000],
        heading: 0,
        pitch: -90,
        roll: 0
      }
    });

    /* =============================================
     *  2. 创建绘制 / 量算工具实例
     * ============================================= */
    const draw    = new geoGlobe.Draw(map);
    const measure = new geoGlobe.Measure(map);

    /* =============================================
     *  3. 绘制
     * ============================================= */
    const drawTips = {
      point:     '左键点击放置点',
      polyline:  '左键添加节点，右键结束',
      polygon:   '左键添加节点，右键结束（至少 3 个点）',
      rectangle: '第一次点击确定起点，第二次点击确定终点',
      circle:    '第一次点击确定圆心，第二次点击确定半径'
    };

    async function doDraw(type) {
      showTip(drawTips[type] || '左键操作，右键结束');
      try {
        const result = await draw[type]();
        if (type === 'point') {
          showTip(`绘制点完成 (${result.position[0].toFixed(4)}, ${result.position[1].toFixed(4)})`);
        } else if (type === 'circle') {
          showTip(`绘制圆完成 - 半径: ${formatDist(result.radius)}`);
        } else if (type === 'rectangle') {
          const c = result.coordinates;
          showTip(`绘制矩形完成 (${c[0].toFixed(4)}, ${c[1].toFixed(4)}) → (${c[2].toFixed(4)}, ${c[3].toFixed(4)})`);
        } else {
          showTip(`绘制${type === 'polyline' ? '折线' : '多边形'}完成 - ${result.positions.length} 个节点`);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function clearDraw() {
      draw.clear();
      showTip('已清除所有绘制结果');
    }

    /* =============================================
     *  4. 量算
     * ============================================= */
    const measureTips = {
      distance: '左键添加节点，右键结束量算',
      area:     '左键添加节点，右键结束量算（至少 3 个点）',
      height:   '左键点击选取位置'
    };

    async function doMeasure(type) {
      showTip(measureTips[type]);
      try {
        const result = await measure[type]();
        if (type === 'distance') {
          showTip(`距离: ${formatDist(result.distance)}（${result.positions.length} 个节点）`);
        } else if (type === 'area') {
          showTip(`面积: ${formatArea(result.area)}`);
        } else if (type === 'height') {
          showTip(`高度: ${result.height.toFixed(2)} m`);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function clearMeasure() {
      measure.clear();
      showTip('已清除所有量算结果');
    }

    /* =============================================
     *  5. 底部 Toolbar 状态栏切换
     * ============================================= */
    let toolbarVisible = true;

    function toggleToolbar() {
      if (!map.toolbar) return;
      map.toolbar.toggle();
      toolbarVisible = !toolbarVisible;
      document.getElementById('btnToolbar').classList.toggle('active', toolbarVisible);
      showTip(toolbarVisible ? '底部状态栏已显示' : '底部状态栏已隐藏');
    }

    // 初始按钮状态
    document.getElementById('btnToolbar').classList.add('active');
    document.getElementById('btnSkyAnim').classList.add('active');
    document.getElementById('btnMeteor').classList.add('active');

    /* =============================================
     *  6. 星空动画控制
     * ============================================= */
    let skyAnimating = true;

    function toggleSkyAnimation() {
      skyAnimating = !skyAnimating;
      if (skyAnimating) {
        geoGlobe.SpaceSkyBox.startAnimation(map.viewer);
        showTip('星星闪烁动画已开启');
      } else {
        geoGlobe.SpaceSkyBox.stopAnimation();
        showTip('星星闪烁动画已关闭');
      }
      document.getElementById('btnSkyAnim').classList.toggle('active', skyAnimating);
    }

    let meteorRunning = true;

    function toggleMeteor() {
      meteorRunning = !meteorRunning;
      if (meteorRunning) {
        geoGlobe.SpaceSkyBox.startMeteorAnimation(map.viewer, { interval: 3000, speed: 1, maxMeteors: 3 });
        showTip('流星效果已开启');
      } else {
        geoGlobe.SpaceSkyBox.stopMeteorAnimation();
        showTip('流星效果已关闭');
      }
      document.getElementById('btnMeteor').classList.toggle('active', meteorRunning);
    }

    function setSkySpeed(level) {
      const speeds = {
        slow: 1,      // 正常闪烁
        normal: 2,    // 较快闪烁
        fast: 4       // 快速闪烁
      };
      geoGlobe.SpaceSkyBox.setRotationSpeed(speeds[level] || speeds.normal);
      if (!skyAnimating) {
        skyAnimating = true;
        geoGlobe.SpaceSkyBox.startAnimation(map.viewer);
        document.getElementById('btnSkyAnim').classList.add('active');
      }
      showTip(`星星闪烁速度: ${level === 'slow' ? '正常' : level === 'fast' ? '快速' : '较快'}`);
    }

    /* =============================================
     *  7. 工具函数
     * ============================================= */
    function formatDist(m) {
      return m >= 1000 ? (m / 1000).toFixed(2) + ' km' : m.toFixed(1) + ' m';
    }

    function formatArea(sqm) {
      return sqm >= 1e6 ? (sqm / 1e6).toFixed(3) + ' km²' : sqm.toFixed(1) + ' m²';
    }

    let tipTimer = null;
    function showTip(text, duration) {
      const el = document.getElementById('tip');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(tipTimer);
      if (duration !== 0) {
        tipTimer = setTimeout(() => el.classList.remove('show'), duration || 4000);
      }
    }

    showTip('geoGlobe3D 已就绪 — 观察星星闪烁效果', 5000);
  </script>
</body>
</html>
