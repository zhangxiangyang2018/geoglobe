<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geoGlobe3D - 空白 Demo</title>
  <link rel="stylesheet" href="../dist/Widgets/widgets.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #mapContainer { width: 100%; height: 100%; overflow: hidden; }

    #drillNav {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      display: flex; align-items: center; gap: 6px;
      font-family: 'Microsoft YaHei', sans-serif;
    }
    #drillNav button {
      background: rgba(20,26,36,0.92); color: #ddd;
      border: 1px solid rgba(255,255,255,.1); border-radius: 4px;
      padding: 6px 14px; cursor: pointer; font-size: 13px;
      transition: background .15s;
    }
    #drillNav button:hover { background: #4a90d9; color: #fff; }

    #breadcrumb {
      background: rgba(20,26,36,0.85); color: #aaa;
      border-radius: 4px; padding: 6px 12px; font-size: 13px;
      pointer-events: none;
    }
    #breadcrumb span { color: #4fc3f7; }

    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(0,0,0,.75); color: #4fc3f7; padding: 12px 24px;
      border-radius: 6px; font-size: 14px; z-index: 2000;
      font-family: 'Microsoft YaHei', sans-serif; display: none;
    }
    #toast {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: rgba(20,26,36,0.92); color: #ffd54f; padding: 10px 22px;
      border-radius: 6px; font-size: 14px; z-index: 2000;
      font-family: 'Microsoft YaHei', sans-serif;
      pointer-events: none; opacity: 0; transition: opacity .25s;
    }
  </style>
</head>
<body>
  <div id="mapContainer"></div>

  <!-- 下钻导航栏 -->
  <div id="drillNav">
    <button id="btnBack" style="display:none" onclick="drillBack()">← 返回上级</button>
    <div id="breadcrumb">重庆市</div>
  </div>
  <div id="loading">加载中…</div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../dist/geoglobe.min.js"></script>
  <script>
    const map = new geoGlobe.GeoMap('mapContainer', {
      skyBox: 'space',
      control: {
        timeline:             false,
        animation:            false,
        baseLayerPicker:      false,
        homeButton:           false,
        sceneModePicker:      false,
        navigationHelpButton: false,
        fullscreenButton:     false,
        toolbar:              true,
        navBar:               true,
        navigation:           true,
      },
      camera: {
        position: [106.55, 29.56, 1500000],
        heading:  0,
        pitch:   -90,
        roll:     0,
      },
    });

    // 禁用 Cesium 内置 InfoBox 弹窗和选中高亮框
    if (map.viewer.infoBox)            map.viewer.infoBox.destroy();
    if (map.viewer.selectionIndicator) map.viewer.selectionIndicator.destroy();
    // 任何实体被选中时立即清除，彻底阻止 InfoBox 弹出
    map.viewer.selectedEntityChanged.addEventListener(() => {
      if (map.viewer.selectedEntity) map.viewer.selectedEntity = undefined;
    });

    // ─── 常量 ─────────────────────────────────────────────────────────────────
    const TOKEN = 'eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIxNTMzMDU2NzU0NiIsImF1ZCI6IkNMSUVOVF9GUkFNRVdPUktfTUFOQUdFUl9XRUIiLCJ5dW5saW9zLXRlbmFudC1jb2RlIjoiMTAwMDAwMSIsIm5iZiI6MTc3ODExOTk4Nywic2NvcGUiOiIxIiwiaXNzIjoiaHR0cDovLzEyNy4wLjAuMS9hdXRob3JpemUiLCJleHAiOjE3NzgyOTI3ODcsImlhdCI6MTc3ODExOTk4NywieXVubGlvcy10ZW5hbnQtdXNlci1ndWlkIjoiNzc1NDA2In0.Ksrp7djwQjnTjN9I_9WxkxUcGGjGK5tsQQ2tvIO4nAHBc8mNTmh-Kppfs7INqYClEKnBtWCs9CsJzkV5judGXsiMaBZny0IwTqJZsLU7XDlRI8OOq9cnfTZRBzYtgw5XvSrSUTNoAbWDN0L4xYHNrWSBDSkBdw4gJEbtKmTo8hv9wAi9FR7dbNH2KRaIuUItl41PhBw_DyW66lcM2z3BB8BmECiP-I2C7dRS8syy2CNSc6RNlupAaBYQWVCLdKlQ3wcHlFuv1gIP0oU0VkU0M_IZSzRJfGdizK-G4wEBw9i7GN9chEATldJvKTUx3LpIazPQybsAsPTvF9PliFrfZw';

    const PALETTE = [
      '#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c',
      '#3498db','#9b59b6','#e91e63','#00bcd4','#8bc34a',
      '#ff5722','#607d8b','#795548','#009688','#673ab7',
      '#03a9f4','#cddc39','#ff9800','#4caf50','#2196f3',
    ];

    // ─── 下钻状态栈 ────────────────────────────────────────────────────────────
    // 每层：{ regionCode, level, name }  ← 用于返回上级
    const drillStack = [];
    let currentName = '重庆市';   // 当前显示层级的名称
    let isDrilling = false;        // 防重复下钻

    // 当前活跃图层（面 + 标注）
    let activeRegionLayer = null;
    let labelEntities = [];  // 直接用 viewer.entities 管理标注，绕过 GraphicLayer

    // ─── 工具函数 ──────────────────────────────────────────────────────────────
    function getRegionCode(props) {
      return props.regionCode ?? props.code ?? props.adcode ??
             props.REGIONCODE ?? props.CODE ?? null;
    }

    function getRegionName(props) {
      return props.name ?? props.regionName ?? props.NAME ?? props.REGIONNAME ?? '';
    }

    function centroid(feature) {
      const p = feature.properties || {};
      // 直接使用后端返回的 centerPoint，数据问题由后台修复
      if (p.centerPoint) {
        const cp = p.centerPoint;
        if (Array.isArray(cp)) return [+cp[0], +cp[1]];
        if (typeof cp === 'string') { const a = cp.split(','); return [+a[0], +a[1]]; }
        if (typeof cp === 'object') {
          const x = cp.x ?? cp.lng ?? cp.longitude;
          const y = cp.y ?? cp.lat ?? cp.latitude;
          if (x != null && y != null) return [+x, +y];
        }
      }
      if (p.centerLng != null && p.centerLat != null) return [+p.centerLng, +p.centerLat];
      return null;
    }

    function setLoading(on) {
      document.getElementById('loading').style.display = on ? 'block' : 'none';
    }

    let _toastTimer = null;
    function showToast(msg, duration = 2200) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.opacity = '1';
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => { el.style.opacity = '0'; }, duration);
    }

    function updateBreadcrumb() {
      // drillStack 存放的是「已访问」的祖先路径，currentName 是当前层
      const trail = [...drillStack.map(s => s.name), currentName];
      const el = document.getElementById('breadcrumb');
      el.innerHTML = trail.map((n, i) =>
        i === trail.length - 1
          ? `<span>${n}</span>`
          : `${n} &rsaquo; `
      ).join('');
      document.getElementById('btnBack').style.display =
        drillStack.length > 0 ? 'inline-block' : 'none';
    }

    // ─── 清除当前图层 ─────────────────────────────────────────────────────────
    function clearLayers() {
      if (map._drillHandler) { map._drillHandler.destroy(); map._drillHandler = null; }
      if (activeRegionLayer) { map.removeLayer(activeRegionLayer); activeRegionLayer = null; }
      // 清除上一层标注
      labelEntities.forEach(e => map.viewer.entities.remove(e));
      labelEntities = [];
    }

    // ─── 核心：加载指定层级 ───────────────────────────────────────────────────
    async function loadLevel(regionCode, level, name) {
      if (isDrilling) return false;   // 防止重复触发
      isDrilling = true;
      setLoading(true);
      clearLayers();

      const url = `https://bst.yjj.cq.gov.cn/mesh/framework/service/region/geojson/level` +
        `?regionCode=${regionCode}&level=${level}&isSimplify=1&returnCenterPoint=1`;

      try {
        const res = await axios.get(url, {
          headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
        });
        const geojson = res.data;

        if ((geojson.features?.length ?? 0) === 0) {
          showToast(`「${name}」已是最底层区域`);
          setLoading(false);
          isDrilling = false;
          return false;
        }

        // console.log('[Drill] first feature properties:', geojson.features[0].properties);
        console.log('[Label] first feature props:', JSON.stringify(geojson.features[0].properties));
        // 挂上颜色属性
        geojson.features.forEach((f, i) => {
          f.properties = f.properties || {};
          f.properties._color = PALETTE[i % PALETTE.length];
        });

        // ── 面图层 ──────────────────────────────────────────────────────────
        activeRegionLayer = new geoGlobe.GeoJsonLayer({
          data: geojson,
          clampToGround: true,
          mapboxStyle: [
            { type: 'fill', paint: { 'fill-color': ['get', '_color'], 'fill-opacity': 0.45 } },
            { type: 'line', paint: { 'line-color': '#ffffff', 'line-width': 1.2 } },
          ],
          // onLoad 内添加标注 + 绑定点击，保证 _dataSource 已就绪
          onLoad(dataSource) {
            dataSource.entities.values.forEach(e => { e.description = undefined; });

            activeRegionLayer.flyTo({ duration: 1.5 });

            // ── 标注：直接用 viewer.entities 添加，最简单可靠 ─────────────────
            labelEntities.forEach(e => map.viewer.entities.remove(e));
            labelEntities = [];

            const seenCodes = new Set();
            let skipNoLabel = 0, skipNoPos = 0, skipDup = 0;
            geojson.features.forEach((feature, idx) => {
              const p = feature.properties || {};
              const code = p.regionCode ?? p.code ?? p.adcode ?? p.REGIONCODE ?? '';
              if (code) {
                if (seenCodes.has(code)) { skipDup++; return; }
                seenCodes.add(code);
              }
              const label = p.alias ?? p.name ?? p.regionName ?? p.regionShortName
                         ?? p.fullName ?? p.NAME ?? p.REGIONNAME ?? '';
              if (!label) {
                skipNoLabel++;
                if (skipNoLabel <= 2) console.warn('[Label] 无名称字段, feature[%d] props=', idx, p);
                return;
              }
              const pos = centroid(feature);
              if (!pos || !isFinite(pos[0]) || !isFinite(pos[1])) {
                skipNoPos++;
                if (skipNoPos <= 2) console.warn('[Label] 无法求中心点, feature[%d] label=%s, geometry.type=%s', idx, label, feature.geometry?.type);
                return;
              }

              const ent = map.viewer.entities.add({
                position: geoGlobe.Cartesian3.fromDegrees(pos[0], pos[1], 0),
                label: {
                  text: label,
                  font: 'bold 14px "Microsoft YaHei", sans-serif',
                  fillColor: geoGlobe.Color.WHITE,
                  outlineColor: geoGlobe.Color.BLACK,
                  outlineWidth: 2,
                  style: geoGlobe.LabelStyle.FILL_AND_OUTLINE,
                  showBackground: false,
                  heightReference: geoGlobe.HeightReference.CLAMP_TO_GROUND,
                  scaleByDistance: new geoGlobe.NearFarScalar(30000, 1.4, 1500000, 0.6),
                  disableDepthTestDistance: Number.MAX_VALUE,
                },
              });
              labelEntities.push(ent);
            });
            console.log('[Label] 添加=%d, 无名跳过=%d, 无坐标跳过=%d, 重复code跳过=%d, features总数=%d',
              labelEntities.length, skipNoLabel, skipNoPos, skipDup, geojson.features.length);

            // ── 点击下钻 ──────────────────────────────────────────────────────
            if (geojson.features.length === 1) {
              showToast(`「${name}」已是最底层区域`);
              isDrilling = false;
              setLoading(false);
              return;
            }

            const t = new Date();
            if (map._drillHandler) { map._drillHandler.destroy(); map._drillHandler = null; }
            map._drillHandler = new geoGlobe.ScreenSpaceEventHandler(map.viewer.scene.canvas);
            map._drillHandler.setInputAction((click) => {
              const picked = map.viewer.scene.pick(click.position);
              const entity = picked?.id;
              if (!entity || !dataSource.entities.contains(entity)) return;
              const p = entity.properties;
              const childCode = String(
                p?.regionCode?.getValue(t) ?? p?.code?.getValue(t)
                ?? p?.adcode?.getValue(t) ?? p?.REGIONCODE?.getValue(t) ?? ''
              );
              const childName = p?.name?.getValue(t) ?? p?.regionName?.getValue(t)
                              ?? p?.alias?.getValue(t) ?? p?.NAME?.getValue(t) ?? name;

              if (!childCode) { console.warn('[Drill] 未找到 regionCode，entity:', entity); return; }
              drillStack.push({ regionCode, level, name });
              currentName = childName;
              loadLevel(childCode, level + 1, childName).then(ok => {
                if (ok) updateBreadcrumb();
                else { drillStack.pop(); currentName = name; }
              });
            }, geoGlobe.ScreenSpaceEventType.LEFT_CLICK);

            isDrilling = false;
            setLoading(false);
          },
        });
        map.addLayer(activeRegionLayer);

        return true;

      } catch (err) {
        console.error('[Drill] 请求失败:', err.message);
        isDrilling = false;
        setLoading(false);
        return false;
      }
    }

    // ─── 返回上级 ─────────────────────────────────────────────────────────────
    async function drillBack() {
      if (!drillStack.length) return;
      const parent = drillStack.pop();
      const prevName = currentName;
      currentName = parent.name;
      const ok = await loadLevel(parent.regionCode, parent.level, parent.name);
      if (ok) updateBreadcrumb();
      else { drillStack.push(parent); currentName = prevName; } // 失败则还原
    }

    // ─── 初始加载：重庆市 level=3 ────────────────────────────────────────────
    currentName = '重庆市';
    loadLevel('500000000000', 3, '重庆市').then(ok => {
      if (ok) updateBreadcrumb();
    });</script>
</body>
</html>
