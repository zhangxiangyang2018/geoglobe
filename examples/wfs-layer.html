<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geoGlobe3D - WFS 图层示例</title>
  <link rel="stylesheet" href="../dist/Widgets/widgets.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #mapContainer { width: 100%; height: 100%; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }

    /* ── 工具栏 ── */
    #toolbars {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      display: flex; gap: 6px; flex-wrap: wrap; max-width: 920px;
    }
    .bar-group {
      background: rgba(20,26,36,0.94); border-radius: 6px;
      padding: 6px 10px; display: flex; align-items: center; gap: 4px;
      box-shadow: 0 2px 10px rgba(0,0,0,.4);
    }
    .bar-group .label { font-size: 11px; color: #888; margin-right: 4px; white-space: nowrap; }
    .bar-group button {
      background: #3a3f4b; color: #ddd;
      border: 1px solid rgba(255,255,255,.06);
      padding: 5px 10px; cursor: pointer; border-radius: 4px;
      font-size: 12px; white-space: nowrap; transition: background .15s;
    }
    .bar-group button:hover { background: #4a90d9; color: #fff; }
    .bar-group button.active { background: #4a90d9; color: #fff; }
    .bar-group button.danger { color: #f06; }
    .bar-group button.danger:hover { background: #d32f2f; color: #fff; }
    .bar-group input[type=text] {
      background: #2a2f3b; color: #ddd; border: 1px solid rgba(255,255,255,.1);
      padding: 4px 8px; border-radius: 4px; font-size: 12px; width: 200px;
      outline: none;
    }
    .bar-group input[type=text]::placeholder { color: #555; }

    /* ── 说明面板 ── */
    #panel {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: rgba(20,26,36,0.94); border-radius: 8px;
      padding: 14px 16px; width: 280px;
      box-shadow: 0 2px 12px rgba(0,0,0,.5); color: #ccc; font-size: 12px;
      line-height: 1.7;
    }
    #panel h3 { color: #fff; font-size: 13px; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 6px; }
    #panel .item { margin-bottom: 6px; }
    #panel .key { color: #4fc3f7; }
    #panel .val { color: #aed581; }
    #panel .sep { border-top: 1px solid #2a2f3b; margin: 8px 0; }
    #panel code {
      background: #1a1f2b; border-radius: 3px; padding: 2px 6px;
      font-size: 11px; color: #f9a825; font-family: Consolas, monospace;
    }

    /* ── 状态条 ── */
    #status {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.78); color: #4fc3f7; font-size: 13px;
      padding: 6px 20px; border-radius: 4px; pointer-events: none;
      transition: opacity .3s; opacity: 0; z-index: 1001; white-space: nowrap;
    }
    #status.show { opacity: 1; }

    /* ── 弹窗 ── */
    #popup-box {
      position: absolute; z-index: 1100; display: none;
      background: rgba(20,26,36,0.96); border: 1px solid #4a90d9;
      border-radius: 6px; padding: 12px 16px; min-width: 180px;
      box-shadow: 0 4px 16px rgba(0,0,0,.6); color: #ccc; font-size: 12px;
    }
    #popup-box h4 { color: #4fc3f7; margin-bottom: 6px; font-size: 13px; }
    #popup-box .prop-row { display: flex; gap: 6px; margin: 3px 0; }
    #popup-box .prop-key { color: #888; min-width: 60px; }
    #popup-box .prop-val { color: #fff; }
    #popup-close {
      float: right; cursor: pointer; color: #888; font-size: 14px;
      margin-left: 8px; line-height: 1;
    }
    #popup-close:hover { color: #f06; }
  </style>
</head>
<body>
  <div id="mapContainer"></div>

  <!-- 工具栏 -->
  <div id="toolbars">

    <!-- WFS 服务配置 -->
    <div class="bar-group">
      <span class="label">服务地址</span>
      <input type="text" id="wfsUrl" placeholder="http://localhost:8080/geoserver/wfs"
             value="http://localhost:8080/geoserver/wfs">
    </div>

    <div class="bar-group">
      <span class="label">图层名</span>
      <input type="text" id="typeName" placeholder="workspace:layerName" value="demo:buildings">
    </div>

    <!-- 加载操作 -->
    <div class="bar-group">
      <span class="label">加载</span>
      <button onclick="loadWfs()">加载图层</button>
      <button onclick="loadWithBbox()">视野范围加载</button>
      <button class="danger" onclick="removeWfs()">移除</button>
    </div>

    <!-- CQL 过滤 -->
    <div class="bar-group">
      <span class="label">CQL过滤</span>
      <input type="text" id="cqlInput" placeholder="height > 10 AND city = 'Beijing'" style="width:220px">
      <button onclick="applyFilter()">应用</button>
      <button onclick="clearFilter()">清除</button>
    </div>

    <!-- 图层控制 -->
    <div class="bar-group">
      <span class="label">控制</span>
      <button id="btnShow" onclick="toggleShow()">隐藏</button>
      <button onclick="raiseTop()">置顶</button>
      <button onclick="flyTo()">定位</button>
    </div>

    <!-- 演示数据 -->
    <div class="bar-group">
      <span class="label">演示</span>
      <button onclick="loadDemo('polygon')">模拟面要素</button>
      <button onclick="loadDemo('line')">模拟线要素</button>
      <button onclick="loadDemo('point')">模拟点要素</button>
    </div>

  </div>

  <!-- 说明面板 -->
  <div id="panel">
    <h3>WFS 图层说明</h3>
    <div class="item">
      <span class="key">协议</span>：OGC WFS（Web Feature Service）<br>
      返回矢量要素，输出格式 <code>GeoJSON</code>
    </div>
    <div class="sep"></div>
    <div class="item"><span class="key">继承自</span> GeoJsonLayer，支持所有样式参数</div>
    <div class="item"><span class="key">自动拼装</span> WFS GetFeature 请求 URL</div>
    <div class="item"><span class="key">支持</span> CQL 属性过滤 / BBOX 空间过滤</div>
    <div class="sep"></div>
    <div class="item"><span class="key">版本</span>：<span class="val" id="infoVersion">—</span></div>
    <div class="item"><span class="key">图层名</span>：<span class="val" id="infoType">—</span></div>
    <div class="item"><span class="key">要素数</span>：<span class="val" id="infoCount">—</span></div>
    <div class="item"><span class="key">状态</span>：<span class="val" id="infoStatus">未加载</span></div>
    <div class="sep"></div>
    <div style="color:#666;font-size:11px;line-height:1.6">
      点击要素可查看属性<br>
      「视野范围加载」使用当前相机 BBOX 作为空间过滤<br>
      「演示」数据为本地模拟，无需真实 WFS 服务
    </div>
  </div>

  <!-- 弹窗 -->
  <div id="popup-box">
    <span id="popup-close" onclick="closePopup()">✕</span>
    <h4 id="popup-title">要素属性</h4>
    <div id="popup-body"></div>
  </div>

  <div id="status"></div>

  <script src="../dist/geoglobe.js"></script>
  <script>
    // ─────────────── 初始化地图 ───────────────
    var map = new geoGlobe.GeoMap('mapContainer', {
      control: {
        timeline: false, animation: false, baseLayerPicker: false,
        homeButton: false, sceneModePicker: false,
        navigationHelpButton: false, fullscreenButton: false,
        toolbar: {
          showLon: true, showLat: true,
          showProjection: false,
          showAltitude: true,
          showLevel: true,
          showHeading: true,
          showPitch: false,
          showCameraHeight: false,
          showFPS: false,
          showScalebar: true,
        },
        navBar: true,
      },
      camera: { position: [116.4, 39.9, 3000000], heading: 0, pitch: -90, roll: 0 }
    });

    // ─────────────── 状态 ───────────────
    var wfsLayer = null;
    var layerVisible = true;

    // ─────────────── 工具函数 ───────────────
    function showStatus(msg, duration) {
      var el = document.getElementById('status');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(function () { el.classList.remove('show'); }, duration || 2500);
    }

    function updatePanel(layer, count, status) {
      document.getElementById('infoVersion').textContent = layer ? (layer._wfsOptions.version || '2.0.0') : '—';
      document.getElementById('infoType').textContent    = layer ? layer._wfsOptions.typeName : '—';
      document.getElementById('infoCount').textContent   = count != null ? count + ' 个' : '—';
      document.getElementById('infoStatus').textContent  = status || '—';
    }

    function closePopup() {
      document.getElementById('popup-box').style.display = 'none';
    }

    // ─────────────── 加载 WFS ───────────────
    function loadWfs(extraOpts) {
      var url      = document.getElementById('wfsUrl').value.trim();
      var typeName = document.getElementById('typeName').value.trim();
      var cql      = document.getElementById('cqlInput').value.trim();

      if (!url || !typeName) { showStatus('请填写服务地址和图层名'); return; }

      if (wfsLayer) { wfsLayer.remove(); wfsLayer = null; }

      showStatus('正在加载 WFS 图层…', 8000);
      updatePanel(null, null, '加载中…');

      var opts = Object.assign({
        url: url,
        typeName: typeName,
        version: '2.0.0',
        clampToGround: true,
        stroke: '#00e5ff',
        strokeWidth: 2,
        fill: 'rgba(0,229,255,0.25)',
        markerColor: '#00e5ff',
        onLoad: function (entities) {
          showStatus('加载完成，共 ' + entities.length + ' 个要素');
          updatePanel(wfsLayer, entities.length, '已加载');
          layerVisible = true;
          document.getElementById('btnShow').textContent = '隐藏';
        },
        onClick: function (entity, click) {
          var props = entity.properties
            ? entity.properties.getValue(geoGlobe.JulianDate.now())
            : {};
          showEntityPopup(entity, props, click.position);
        },
      }, extraOpts || {});

      if (cql) opts.cqlFilter = cql;

      wfsLayer = new geoGlobe.WfsLayer(opts);
      wfsLayer.addTo(map);

      updatePanel(wfsLayer, null, '加载中…');
    }

    // 使用当前视野 BBOX 加载
    function loadWithBbox() {
      var rect = map.viewer.camera.computeViewRectangle(map.viewer.scene.globe.ellipsoid);
      if (!rect) { showStatus('无法获取视野范围'); return; }
      var bbox = [
        geoGlobe.CesiumMath.toDegrees(rect.west),
        geoGlobe.CesiumMath.toDegrees(rect.south),
        geoGlobe.CesiumMath.toDegrees(rect.east),
        geoGlobe.CesiumMath.toDegrees(rect.north),
      ];
      loadWfs({ bbox: bbox });
    }

    // ─────────────── 过滤 ───────────────
    function applyFilter() {
      if (!wfsLayer) { showStatus('请先加载图层'); return; }
      var cql = document.getElementById('cqlInput').value.trim();
      if (!cql) { showStatus('请输入 CQL 过滤表达式'); return; }
      showStatus('正在更新过滤条件…', 5000);
      updatePanel(wfsLayer, null, '过滤中…');
      wfsLayer.reload({ cqlFilter: cql });
    }

    function clearFilter() {
      document.getElementById('cqlInput').value = '';
      if (!wfsLayer) return;
      showStatus('清除过滤，重新加载…', 5000);
      wfsLayer.reload({ cqlFilter: null });
    }

    // ─────────────── 显隐 / 置顶 / 定位 ───────────────
    function toggleShow() {
      if (!wfsLayer) { showStatus('请先加载图层'); return; }
      layerVisible = !layerVisible;
      wfsLayer.setShow(layerVisible);
      document.getElementById('btnShow').textContent = layerVisible ? '隐藏' : '显示';
      showStatus(layerVisible ? '图层已显示' : '图层已隐藏');
    }

    function raiseTop() {
      if (!wfsLayer) { showStatus('请先加载图层'); return; }
      wfsLayer.raiseToTop();
      showStatus('已置顶');
    }

    function flyTo() {
      if (!wfsLayer) { showStatus('请先加载图层'); return; }
      wfsLayer.flyTo();
    }

    function removeWfs() {
      if (!wfsLayer) return;
      wfsLayer.remove();
      wfsLayer = null;
      updatePanel(null, null, '未加载');
      showStatus('图层已移除');
    }

    // ─────────────── 要素弹窗 ───────────────
    function showEntityPopup(entity, props, screenPos) {
      var box  = document.getElementById('popup-box');
      var body = document.getElementById('popup-body');
      var keys = Object.keys(props || {});

      document.getElementById('popup-title').textContent = props.name || props.NAME || '要素属性';
      body.innerHTML = keys.length === 0
        ? '<span style="color:#666">无属性数据</span>'
        : keys.map(function (k) {
            return '<div class="prop-row"><span class="prop-key">' + k + '</span>'
                 + '<span class="prop-val">' + props[k] + '</span></div>';
          }).join('');

      box.style.display = 'block';
      box.style.left = (screenPos.x + 12) + 'px';
      box.style.top  = (screenPos.y - 20) + 'px';
    }

    // ─────────────── 本地演示数据（无需真实 WFS 服务） ───────────────
    var DEMO_DATA = {
      polygon: {
        type: 'FeatureCollection',
        features: [
          { type: 'Feature', properties: { name: '北京市', city: 'Beijing', height: 50, population: 2154 },
            geometry: { type: 'Polygon', coordinates: [[[115.7,39.4],[116.0,39.4],[116.8,39.5],[117.2,40.0],[116.7,40.5],[115.9,40.5],[115.4,40.1],[115.7,39.4]]] } },
          { type: 'Feature', properties: { name: '天津市', city: 'Tianjin', height: 30, population: 1561 },
            geometry: { type: 'Polygon', coordinates: [[[116.7,38.6],[117.0,38.6],[117.8,38.8],[118.0,39.2],[117.6,39.8],[117.0,39.7],[116.7,39.3],[116.7,38.6]]] } },
          { type: 'Feature', properties: { name: '上海市', city: 'Shanghai', height: 80, population: 2487 },
            geometry: { type: 'Polygon', coordinates: [[[120.9,30.7],[121.2,30.7],[121.9,31.0],[122.2,31.5],[121.5,31.8],[121.0,31.5],[120.8,31.1],[120.9,30.7]]] } },
          { type: 'Feature', properties: { name: '广州市', city: 'Guangzhou', height: 45, population: 1868 },
            geometry: { type: 'Polygon', coordinates: [[[112.6,22.8],[113.0,22.7],[113.7,22.9],[114.1,23.3],[113.5,23.8],[112.9,23.6],[112.5,23.2],[112.6,22.8]]] } },
        ]
      },
      line: {
        type: 'FeatureCollection',
        features: [
          { type: 'Feature', properties: { name: '京沪高速', level: 'highway', length_km: 1262 },
            geometry: { type: 'LineString', coordinates: [[116.4,39.9],[117.2,38.5],[117.0,36.7],[118.8,32.1],[120.9,31.5],[121.5,31.2]] } },
          { type: 'Feature', properties: { name: '京广高速', level: 'highway', length_km: 2294 },
            geometry: { type: 'LineString', coordinates: [[116.4,39.9],[114.5,38.0],[113.7,34.8],[114.3,30.6],[113.3,23.1]] } },
          { type: 'Feature', properties: { name: '沪成高速', level: 'trunk', length_km: 1985 },
            geometry: { type: 'LineString', coordinates: [[121.5,31.2],[118.8,32.1],[114.3,30.6],[108.9,30.5],[104.1,30.6]] } },
          { type: 'Feature', properties: { name: '西成高速', level: 'trunk', length_km: 658 },
            geometry: { type: 'LineString', coordinates: [[108.9,34.3],[107.0,33.1],[105.7,31.5],[104.1,30.6]] } },
        ]
      },
      point: {
        type: 'FeatureCollection',
        features: [
          { type: 'Feature', properties: { name: '北京', city: 'Beijing', category: 'capital', population: 2154 },
            geometry: { type: 'Point', coordinates: [116.4, 39.9] } },
          { type: 'Feature', properties: { name: '上海', city: 'Shanghai', category: 'tier1', population: 2487 },
            geometry: { type: 'Point', coordinates: [121.5, 31.2] } },
          { type: 'Feature', properties: { name: '广州', city: 'Guangzhou', category: 'tier1', population: 1868 },
            geometry: { type: 'Point', coordinates: [113.3, 23.1] } },
          { type: 'Feature', properties: { name: '成都', city: 'Chengdu', category: 'new-tier1', population: 2094 },
            geometry: { type: 'Point', coordinates: [104.1, 30.6] } },
          { type: 'Feature', properties: { name: '武汉', city: 'Wuhan', category: 'new-tier1', population: 1232 },
            geometry: { type: 'Point', coordinates: [114.3, 30.6] } },
          { type: 'Feature', properties: { name: '西安', city: 'Xian', category: 'new-tier1', population: 1295 },
            geometry: { type: 'Point', coordinates: [108.9, 34.3] } },
          { type: 'Feature', properties: { name: '杭州', city: 'Hangzhou', category: 'new-tier1', population: 1194 },
            geometry: { type: 'Point', coordinates: [120.2, 30.3] } },
          { type: 'Feature', properties: { name: '南京', city: 'Nanjing', category: 'new-tier1', population: 931 },
            geometry: { type: 'Point', coordinates: [118.8, 32.1] } },
        ]
      }
    };

    /**
     * 演示模式：用本地 GeoJSON 模拟 WFS 响应
     * 通过 GeoJsonLayer(data:...) 直接加载，演示 WfsLayer 等价效果
     */
    function loadDemo(type) {
      if (wfsLayer) { wfsLayer.remove(); wfsLayer = null; }

      var geojson = DEMO_DATA[type];
      if (!geojson) return;

      var styleMap = {
        polygon: { stroke: '#00e5ff', strokeWidth: 2, fill: 'rgba(0,229,255,0.25)', markerColor: '#00e5ff' },
        line:    { stroke: '#ffd54f', strokeWidth: 3, fill: 'rgba(255,213,79,0.2)',  markerColor: '#ffd54f' },
        point:   { stroke: '#69f0ae', strokeWidth: 2, fill: 'rgba(105,240,174,0.4)', markerColor: '#69f0ae' },
      };

      var style = styleMap[type];
      var typeLabelMap = { polygon: '面要素（模拟）', line: '线要素（模拟）', point: '点要素（模拟）' };

      // 演示时用 GeoJsonLayer 直接加载内联数据（与 WfsLayer 加载后等价）
      wfsLayer = new geoGlobe.GeoJsonLayer(Object.assign({
        name: typeLabelMap[type],
        data: geojson,
        clampToGround: true,
        onLoad: function (ds) {
          var n = ds.entities ? ds.entities.values.length : 0;
          showStatus('演示数据加载完成，共 ' + n + ' 个要素');
          updatePanel({ _wfsOptions: { typeName: typeLabelMap[type], version: '—' } }, n, '演示数据');
          layerVisible = true;
          document.getElementById('btnShow').textContent = '隐藏';
          map.viewer.flyTo(ds, { duration: 2 });
        },
        onClick: function (entity, click) {
          var props = entity.properties
            ? entity.properties.getValue(geoGlobe.JulianDate.now())
            : {};
          showEntityPopup(entity, props, click.position);
        },
      }, style));

      wfsLayer.addTo(map);
      updatePanel({ _wfsOptions: { typeName: typeLabelMap[type], version: '—' } }, null, '加载中…');
    }
  </script>
</body>
</html>
