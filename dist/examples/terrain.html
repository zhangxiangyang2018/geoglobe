<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geoGlobe3D 地形示例 - Toolbar 海拔</title>
  <link rel="stylesheet" href="../lib/Widgets/widgets.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #mapContainer { width: 100%; height: 100%; overflow: hidden; }

    #toolbars {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .bar-group {
      background: rgba(20, 26, 36, 0.92);
      border-radius: 6px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 10px rgba(0,0,0,.4);
    }

    .bar-group .group-label {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      user-select: none;
    }

    .bar-group button {
      background: #3a3f4b;
      color: #ddd;
      border: 1px solid rgba(255,255,255,.08);
      padding: 5px 12px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      transition: background .18s, color .18s;
      font-family: 'Microsoft YaHei', sans-serif;
    }
    .bar-group button:hover  { background: #4a90d9; color: #fff; }
    .bar-group button:active { background: #3b7ac2; }
    .bar-group button.active { background: #4a90d9; color: #fff; border-color: #4a90d9; }

    #tip {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      background: rgba(0,0,0,.75);
      color: #4fc3f7;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 4px;
      pointer-events: none;
      transition: opacity .3s;
      opacity: 0;
      white-space: nowrap;
      font-family: 'Microsoft YaHei', sans-serif;
    }
    #tip.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="mapContainer"></div>

  <div id="toolbars">
    <!-- 视角跳转 -->
    <div class="bar-group">
      <span class="group-label">📍 跳转</span>
      <button onclick="flyTo('everest')">珠穆朗玛</button>
      <button onclick="flyTo('canyon')">科罗拉多峡谷</button>
      <button onclick="flyTo('alps')">阿尔卑斯山</button>
      <button onclick="flyTo('china')">全国</button>
    </div>

    <!-- 显示控制 -->
    <div class="bar-group">
      <span class="group-label">🔧 控制</span>
      <button id="btnDepth"   onclick="toggleDepth()"   title="开启后地下物体被遮挡" class="active">地形遮挡</button>
      <button id="btnLight"   onclick="toggleLight()"   title="开启地形光照" class="active">光照</button>
      <button id="btnToolbar" onclick="toggleToolbar()" title="切换底部状态栏" class="active">状态栏</button>
      <button id="btnExag"    onclick="toggleExag()"    title="循环切换地形夸张倍数 1x/1.5x/2.5x/5x" class="active">地形夸张</button>
    </div>
  </div>

  <div id="tip"></div>

  <script src="../lib/geoglobe.min.js"></script>
  <script>
    /* ═══════════════════════════════════════════════
     *  初始化地图 — 启用地形 + Toolbar
     * ═══════════════════════════════════════════════ */
    const map = new geoGlobe.GeoMap('mapContainer', {
      accessToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI2ZWI5ZTA0YS1hNWJlLTRkM2ItYjk3Mi1jMzg3OTYxOWIzZWMiLCJpZCI6MjcxMjE2LCJzdWIiOiJ4aWFuZ3lhbmcyMDE4IiwiaXNzIjoiaHR0cHM6Ly9hcGkuY2VzaXVtLmNvbSIsImF1ZCI6InhpYW5neWFuZzIwMThfZGVmYXVsdCIsImlhdCI6MTc4MDA0NTU3OX0.2kToxLoJ4xCYUOvR_K8Ua8Og3xytcPRdt-rKmcPxg-Y',
      terrain: {
        enabled: true
      },
      scene: {
        globe: {
          depthTestAgainstTerrain: true,    // 地形遮挡
          enableLighting: true,             // 太阳光照
          terrainExaggeration: 2.5          // 地形夸张（默认1.0，2.5让山谷更明显）
        }
      },
      control: {
        timeline:             false,
        animation:            false,
        baseLayerPicker:      false,
        homeButton:           false,
        sceneModePicker:      false,
        navigationHelpButton: false,
        fullscreenButton:     false,
        toolbar:    true,   // ← 底部状态栏（含海拔精确采样）
        navBar:     true,   // ← 左侧导航栏：罗盘 + 复位 + 2D/3D + 放大/缩小
        navigation: false   // 已用 navBar 替代
      },
      camera: {
        position: [86.9505, 26.3405, 3337],
        heading: 1,
        pitch: -1,
        roll: 0
      }
    });

    /* ═══════════════════════════════════════════════
     *  预设视角（使用 map.flyTo([lon, lat, alt], options)）
     * ═══════════════════════════════════════════════ */
    const LOCATIONS = {
      everest: { pos: [86.925, 27.988,   8000],  pitch: -20, label: '珠穆朗玛 (8848m)' },
      canyon:  { pos: [-112.1, 36.1,    4000],   pitch: -25, label: '科罗拉多大峡谷' },
      alps:    { pos: [7.7,    45.85,   6000],   pitch: -25, label: '阿尔卑斯山' },
      china:   { pos: [104.0,  35.5, 5000000],   pitch: -90, label: '中国全景' }
    };

    function flyTo(key) {
      const loc = LOCATIONS[key];
      if (!loc) return;
      map.flyTo(loc.pos, { pitch: loc.pitch, duration: 2 });
      showTip('正在飞往：' + loc.label, 3000);
    }

    /* ═══════════════════════════════════════════════
     *  控制开关
     * ═══════════════════════════════════════════════ */
    let depthOn = true;
    function toggleDepth() {
      depthOn = !depthOn;
      map.viewer.scene.globe.depthTestAgainstTerrain = depthOn;
      document.getElementById('btnDepth').classList.toggle('active', depthOn);
      showTip('地形遮挡：' + (depthOn ? '开启' : '关闭'));
    }

    let lightOn = true;
    function toggleLight() {
      lightOn = !lightOn;
      map.viewer.scene.globe.enableLighting = lightOn;
      document.getElementById('btnLight').classList.toggle('active', lightOn);
      showTip('太阳光照：' + (lightOn ? '开启' : '关闭'));
    }

    let exagOn = true;
    const EXAG_VALUES = [1.0, 1.5, 2.5, 5.0];
    let exagIdx = 2; // 默认 2.5
    function toggleExag() {
      exagIdx = (exagIdx + 1) % EXAG_VALUES.length;
      const v = EXAG_VALUES[exagIdx];
      map.viewer.scene.globe.terrainExaggeration = v;
      document.getElementById('btnExag').classList.toggle('active', v > 1.0);
      showTip('地形夸张倍数：' + v + 'x');
    }

    let toolbarVisible = true;
    function toggleToolbar() {
      if (!map.toolbar) return;
      map.toolbar.toggle();
      toolbarVisible = !toolbarVisible;
      document.getElementById('btnToolbar').classList.toggle('active', toolbarVisible);
      showTip('底部状态栏：' + (toolbarVisible ? '已显示' : '已隐藏'));
    }

    /* ═══════════════════════════════════════════════
     *  提示
     * ═══════════════════════════════════════════════ */
    let tipTimer = null;
    function showTip(text, duration = 3500) {
      const el = document.getElementById('tip');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(tipTimer);
      tipTimer = setTimeout(() => el.classList.remove('show'), duration);
    }

    showTip('地形已加载 — 移动鼠标查看底部海拔', 5000);
  </script>
</body>
</html>
