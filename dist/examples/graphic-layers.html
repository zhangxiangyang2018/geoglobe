<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geoGlobe3D 示例 - 图形图层与各类 Graphic</title>
  <link rel="stylesheet" href="../lib/Widgets/widgets.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #mapContainer { width: 100%; height: 100%; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }

    #toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      max-width: 600px;
    }

    .bar-group {
      background: rgba(20, 26, 36, 0.94);
      border-radius: 6px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 10px rgba(0,0,0,.4);
    }

    .bar-group .label {
      font-size: 11px;
      color: #888;
      margin-right: 4px;
      white-space: nowrap;
    }

    .bar-group button {
      background: #3a3f4b;
      color: #ddd;
      border: 1px solid rgba(255,255,255,.06);
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      transition: background .15s;
    }

    .bar-group button:hover { background: #4a90d9; color: #fff; }
    .bar-group button.danger { color: #f06; }
    .bar-group button.danger:hover { background: #d32f2f; color: #fff; }

    #info {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.78);
      color: #4fc3f7;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 4px;
      pointer-events: none;
      transition: opacity .3s;
      opacity: 0;
      z-index: 1001;
      white-space: nowrap;
    }

    #info.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="mapContainer"></div>

  <div id="toolbar">
    <div class="bar-group">
      <span class="label">📍 基本图形</span>
      <button onclick="addPoint()">点</button>
      <button onclick="addBillboard()">广告牌</button>
      <button onclick="addLabel()">文字</button>
      <button onclick="addPolyline()">折线</button>
      <button onclick="addPolygon()">多边形</button>
      <button onclick="addCircle()">圆</button>
    </div>

    <div class="bar-group">
      <span class="label">🔷 几何体</span>
      <button onclick="addEllipse()">椭圆</button>
      <button onclick="addRectangle()">矩形</button>
      <button onclick="addWall()">墙</button>
      <button onclick="addBox()">方盒</button>
      <button onclick="addCylinder()">圆柱</button>
      <button onclick="addEllipsoid()">球体</button>
    </div>

    <div class="bar-group">
      <span class="label">🔧 操作</span>
      <button onclick="toggleLayer()">显隐切换</button>
      <button onclick="flyToLayer()">定位图层</button>
      <button onclick="showCount()">图形数量</button>
      <button class="danger" onclick="clearAll()">清空</button>
    </div>
  </div>

  <div id="info"></div>

  <script src="../lib/geoglobe.min.js"></script>
  <script>
    /* ═══════════════════════════════════════
     *  初始化
     * ═══════════════════════════════════════ */
    const map = new geoGlobe.GeoMap('mapContainer', {
      control: {
        timeline: false, animation: false, baseLayerPicker: false,
        homeButton: false, sceneModePicker: false,
        navigationHelpButton: false, fullscreenButton: false,
        toolbar: true, navBar: true
      },
      camera: { position: [116.39, 39.91, 2000000], heading: 0, pitch: -90, roll: 0 }
    });

    // 创建图形图层
    const graphicLayer = new geoGlobe.GraphicLayer({ name: '图形演示' });
    map.addLayer(graphicLayer);

    /* ═══════════════════════════════════════
     *  随机坐标辅助函数
     * ═══════════════════════════════════════ */
    function rngLon() { return 110 + Math.random() * 14; }
    function rngLat() { return 34 + Math.random() * 12; }
    function rngColor() { return '#' + Math.floor(Math.random() * 0xFFFFFF).toString(16).padStart(6, '0'); }

    /* ═══════════════════════════════════════
     *  添加各类图形
     * ═══════════════════════════════════════ */

    function addPoint() {
      const g = new geoGlobe.PointGraphic({
        position: [rngLon(), rngLat(), 0],
        style: { pixelSize: 10, color: rngColor(), outlineColor: '#fff', outlineWidth: 2 },
        tooltip: '这是一个点图形'
      });
      graphicLayer.addGraphic(g);
      tip('已添加 PointGraphic');
    }

    function addBillboard() {
      const c = rngColor();
      const g = new geoGlobe.BillboardGraphic({
        position: [rngLon(), rngLat(), 0],
        style: {
          image: 'data:image/svg+xml,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32">' +
            '<circle cx="16" cy="16" r="14" fill="' + c + '" stroke="#fff" stroke-width="2"/></svg>'
          ),
          scale: 1.0
        },
        tooltip: '这是一个 Billboard'
      });
      graphicLayer.addGraphic(g);
      tip('已添加 BillboardGraphic');
    }

    function addLabel() {
      const g = new geoGlobe.LabelGraphic({
        position: [rngLon(), rngLat(), 0],
        style: {
          text: '标注文字',
          font: '14px sans-serif',
          fillColor: '#ffffff',
          outlineColor: '#000000',
          outlineWidth: 2,
          style: 'fillAndOutline',
          showBackground: true,
          backgroundColor: 'rgba(0,0,0,0.6)'
        }
      });
      graphicLayer.addGraphic(g);
      tip('已添加 LabelGraphic');
    }

    function addPolyline() {
      const positions = [];
      for (let i = 0; i < 5; i++) positions.push([rngLon(), rngLat(), 0]);
      const g = new geoGlobe.PolylineGraphic({
        positions,
        style: { width: 4, material: { type: 'color', color: rngColor() } }
      });
      graphicLayer.addGraphic(g);
      tip('已添加 PolylineGraphic（5 个节点）');
    }

    function addPolygon() {
      const cx = rngLon(), cy = rngLat();
      const positions = [];
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI * 2 / 6) * i;
        positions.push([cx + Math.cos(a) * 2, cy + Math.sin(a) * 1.5, 0]);
      }
      const g = new geoGlobe.PolygonGraphic({
        positions,
        style: { color: rngColor() + '80', outline: true, outlineColor: '#fff', outlineWidth: 2 }
      });
      graphicLayer.addGraphic(g);
      tip('已添加 PolygonGraphic（六边形）');
    }

    function addCircle() {
      const g = new geoGlobe.CircleGraphic({
        position: [rngLon(), rngLat(), 0],
        style: { radius: 100000 + Math.random() * 200000, color: rngColor() + '60', outline: true, outlineColor: '#fff' }
      });
      graphicLayer.addGraphic(g);
      tip('已添加 CircleGraphic');
    }

    function addEllipse() {
      const g = new geoGlobe.EllipseGraphic({
        position: [rngLon(), rngLat(), 0],
        style: {
          semiMajorAxis: 200000 + Math.random() * 150000,
          semiMinorAxis: 80000 + Math.random() * 80000,
          rotation: Math.random() * Math.PI,
          color: rngColor() + '70',
          outline: true,
          outlineColor: '#fff'
        }
      });
      graphicLayer.addGraphic(g);
      tip('已添加 EllipseGraphic');
    }

    function addRectangle() {
      const lon = rngLon(), lat = rngLat();
      const g = new geoGlobe.RectangleGraphic({
        coordinates: [lon, lat, lon + 3, lat + 2],
        style: { color: rngColor() + '60', outline: true, outlineColor: '#fff' }
      });
      graphicLayer.addGraphic(g);
      tip('已添加 RectangleGraphic');
    }

    function addWall() {
      const positions = [];
      for (let i = 0; i < 5; i++) positions.push([rngLon(), rngLat(), 50000 + Math.random() * 100000]);
      const g = new geoGlobe.WallGraphic({
        positions,
        style: { color: rngColor() + '99' }
      });
      graphicLayer.addGraphic(g);
      tip('已添加 WallGraphic');
    }

    function addBox() {
      const g = new geoGlobe.BoxGraphic({
        position: [rngLon(), rngLat(), 150000],
        style: { dimensions: [80000, 60000, 120000], color: rngColor() + 'aa' }
      });
      graphicLayer.addGraphic(g);
      tip('已添加 BoxGraphic');
    }

    function addCylinder() {
      const g = new geoGlobe.CylinderGraphic({
        position: [rngLon(), rngLat(), 100000],
        style: { topRadius: 40000, bottomRadius: 60000, length: 120000, color: rngColor() + 'aa' }
      });
      graphicLayer.addGraphic(g);
      tip('已添加 CylinderGraphic');
    }

    function addEllipsoid() {
      const r = 50000 + Math.random() * 80000;
      const g = new geoGlobe.EllipsoidGraphic({
        position: [rngLon(), rngLat(), r],
        style: { radii: [r, r, r * 0.7], color: rngColor() + '88' }
      });
      graphicLayer.addGraphic(g);
      tip('已添加 EllipsoidGraphic');
    }

    /* ═══════════════════════════════════════
     *  图层操作
     * ═══════════════════════════════════════ */
    function toggleLayer() {
      graphicLayer.toggleShow();
      tip(graphicLayer.show ? '图形图层已显示' : '图形图层已隐藏');
    }

    function flyToLayer() {
      graphicLayer.flyTo();
      tip('正在定位到图形图层...');
    }

    function showCount() {
      tip('当前图形数量: ' + graphicLayer.length);
    }

    function clearAll() {
      graphicLayer.clear();
      tip('已清空所有图形');
    }

    /* ═══════════════════════════════════════
     *  提示
     * ═══════════════════════════════════════ */
    let tipTimer;
    function tip(text) {
      const el = document.getElementById('info');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(tipTimer);
      tipTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    tip('geoGlobe3D 图形图层示例已就绪 — 点击按钮添加各类图形');
  </script>
</body>
</html>
