<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>geoGlobe3D - 材质示例</title>
  <link rel="stylesheet" href="../lib/Widgets/widgets.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; overflow: hidden; }

    #panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 999;
      width: 260px;
      background: rgba(20, 24, 32, 0.92);
      border-radius: 8px;
      padding: 12px;
      color: #ccc;
      font: 13px 'Microsoft YaHei', sans-serif;
      box-shadow: 0 4px 16px rgba(0,0,0,.5);
    }
    #panel h3 {
      color: #4fc3f7;
      margin-bottom: 10px;
      font-size: 14px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      padding-bottom: 6px;
    }
    .section { margin-bottom: 10px; }
    .section-title {
      color: #aaa;
      font-size: 11px;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .btn-row { display: flex; flex-wrap: wrap; gap: 5px; }
    button {
      background: #2a3042;
      color: #ddd;
      border: 1px solid rgba(255,255,255,.1);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    button:hover { background: #3a7bd5; color: #fff; }
    button.active { background: #3a7bd5; color: #fff; border-color: #3a7bd5; }

    #tip {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.75);
      color: #4fc3f7;
      padding: 6px 16px;
      border-radius: 4px;
      font: 13px sans-serif;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s;
    }
    #tip.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <h3>材质演示</h3>

    <div class="section">
      <div class="section-title">面 / 圆 / 矩形 材质</div>
      <div class="btn-row">
        <button onclick="demo('color')">纯色</button>
        <button onclick="demo('image')">图片</button>
        <button onclick="demo('checkerboard')">棋盘</button>
        <button onclick="demo('stripe')">条纹</button>
        <button onclick="demo('grid')">网格</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">线材质</div>
      <div class="btn-row">
        <button onclick="demoLine('solid')">实线</button>
        <button onclick="demoLine('dash')">虚线</button>
        <button onclick="demoLine('glow')">发光</button>
        <button onclick="demoLine('arrow')">箭头</button>
        <button onclick="demoLine('outline')">描边</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">原生 Cesium.Material（Fabric）</div>
      <div class="btn-row">
        <button onclick="demoFabric('water')">水面</button>
        <button onclick="demoFabric('rimLight')">边缘光</button>
        <button onclick="demoFabric('elevation')">高程等值线</button>
        <button onclick="demoFabric('custom')">自定义GLSL</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">原生 MaterialProperty（透传）</div>
      <div class="btn-row">
        <button onclick="demoNative('dynamic')">动态颜色</button>
        <button onclick="demoNative('imageAnim')">图片+透明</button>
      </div>
    </div>

    <div class="section">
      <div class="btn-row">
        <button onclick="clearAll()" style="color:#f06">清 除</button>
      </div>
    </div>
  </div>

  <div id="tip"></div>

  <script src="../lib/geoglobe.min.js"></script>
  <script>
    const G = geoGlobe;

    /* ── 初始化地图 ── */
    const map = new G.GeoMap('map', {
      control: {
        timeline: false, animation: false, baseLayerPicker: false,
        homeButton: false, sceneModePicker: false,
        navigationHelpButton: false, fullscreenButton: false,
      },
      camera: { position: [116.39, 39.91, 500000], pitch: -60 }
    });

    const graphicLayer = new G.GraphicLayer();
    map.addLayer(graphicLayer);

    /* ─── 面材质测试点 ─── */
    const POLY_POSITIONS = [
      [116.2, 39.8], [116.6, 39.8], [116.6, 40.1], [116.2, 40.1]
    ];
    const CIRCLE_CENTER  = [116.9, 39.9, 0];
    const RECT_COORDS    = [117.1, 39.7, 117.5, 40.1];

    let tipTimer;
    let fabricPrimitive = null;
    function clearAll() {
      graphicLayer.clear();
      if (fabricPrimitive && !fabricPrimitive.isDestroyed()) {
        map.viewer.scene.primitives.remove(fabricPrimitive);
        fabricPrimitive = null;
      }
      tip('已清除');
    }

    /* ── 面/圆/矩形 内置材质 ── */
    function demo(type) {
      clearAll();
      let mat;
      switch (type) {
        case 'color':
          mat = null; // 不传 material，用 color
          break;
        case 'image':
          // 使用 Cesium 内置默认贴图 URL（你可换成自己的图片）
          mat = { type: 'image', image: 'https://cesium.com/downloads/cesiumjs/releases/1.117/Build/Cesium/Assets/Textures/checkerboard.png', repeat: [4, 4] };
          tip('图片材质：repeat [4,4]，可换成自定义贴图 URL');
          break;
        case 'checkerboard':
          mat = { type: 'checkerboard', evenColor: '#fff', oddColor: '#2255aa', repeat: [8, 8] };
          tip('棋盘材质');
          break;
        case 'stripe':
          mat = { type: 'stripe', evenColor: 'rgba(255,100,0,0.8)', oddColor: 'rgba(0,100,255,0.6)', repeat: 12, orientation: 'h' };
          tip('条纹材质 — orientation: "h"|"v"');
          break;
        case 'grid':
          mat = { type: 'grid', color: 'rgba(0,255,200,0.9)', cellAlpha: 0.05, lineCount: [10, 10] };
          tip('网格材质');
          break;
      }

      const stylePolygon = mat ? { material: mat } : { color: 'rgba(100,180,255,0.6)' };
      const styleCircle  = mat ? { radius: 30000, material: mat } : { radius: 30000, color: 'rgba(255,200,50,0.6)' };
      const styleRect    = mat ? { material: mat } : { color: 'rgba(200,100,255,0.5)' };

      graphicLayer.addGraphic(new G.PolygonGraphic({ positions: POLY_POSITIONS, style: stylePolygon }));
      graphicLayer.addGraphic(new G.CircleGraphic({ position: CIRCLE_CENTER, style: styleCircle }));
      graphicLayer.addGraphic(new G.RectangleGraphic({ coordinates: RECT_COORDS, style: styleRect }));

      if (type === 'color') tip('纯色材质（直接用 color 字符串）');
    }

    /* ── 线材质 ── */
    const LINE_POSITIONS = [
      [116.0, 39.5], [116.4, 39.7], [116.8, 39.5], [117.2, 39.7]
    ];

    function demoLine(type) {
      clearAll();
      let style;
      switch (type) {
        case 'solid':
          style = { color: '#00e5ff', width: 5 };
          tip('实线');
          break;
        case 'dash':
          style = { material: { type: 'dash', color: '#ffeb3b', dashLength: 20 }, width: 4 };
          tip('虚线 — dashLength 控制段长');
          break;
        case 'glow':
          style = { material: { type: 'glow', color: '#ff6b35', glowPower: 0.4 }, width: 8 };
          tip('发光线 — glowPower 控制光晕强度');
          break;
        case 'arrow':
          style = { material: { type: 'arrow', color: '#69f0ae' }, width: 20 };
          tip('箭头线 — 推荐宽度 >= 12');
          break;
        case 'outline':
          style = { material: { type: 'outline', color: '#fff', outlineColor: '#1565c0', outlineWidth: 4 }, width: 10 };
          tip('描边线');
          break;
      }
      graphicLayer.addGraphic(new G.PolylineGraphic({ positions: LINE_POSITIONS, style }));
    }

    /* ── 原生 Cesium.Material（Fabric 体系）— 必须用 Primitive API ── */
    function demoFabric(type) {
      clearAll();
      let cesiumMat;
      switch (type) {
        case 'water':
          cesiumMat = G.Material.fromType('Water', {
            baseWaterColor: new G.Color(0.1, 0.3, 0.7, 1),
            frequency: 500,
            animationSpeed: 0.03,
            amplitude: 5,
          });
          tip('水面材质（Cesium 内置 Water Fabric）');
          break;
        case 'rimLight':
          cesiumMat = G.Material.fromType('RimLighting', {
            color: G.Color.fromCssColorString('rgba(0,200,255,0.8)'),
            rimColor: G.Color.fromCssColorString('rgba(255,255,255,0.6)'),
            width: 0.4,
          });
          tip('边缘发光（RimLighting Fabric）');
          break;
        case 'elevation':
          cesiumMat = G.Material.fromType('ElevationContour', {
            spacing: 50,
            color: G.Color.RED,
            width: 2,
          });
          tip('高程等值线（ElevationContour，地形上效果更明显）');
          break;
        case 'custom': {
          cesiumMat = new G.Material({
            fabric: {
              uniforms: { time: 0.0 },
              source: `
                czm_material czm_getMaterial(czm_materialInput materialInput) {
                  czm_material m = czm_getDefaultMaterial(materialInput);
                  float r = abs(sin(materialInput.st.x * 10.0 + time));
                  float g = abs(cos(materialInput.st.y * 10.0 + time));
                  m.diffuse = vec3(r, g, 0.5);
                  m.alpha = 0.75;
                  return m;
                }
              `,
            },
            translucent: true,
          });
          const startTime = Date.now();
          map.viewer.scene.preRender.addEventListener(() => {
            cesiumMat.uniforms.time = (Date.now() - startTime) / 1000;
          });
          tip('自定义 GLSL Fabric — 动态色彩');
          break;
        }
      }

      // Fabric 材质只能用 Primitive API（Entity API 不支持 Cesium.Material）
      fabricPrimitive = map.viewer.scene.primitives.add(new G.Primitive({
        geometryInstances: new G.GeometryInstance({
          geometry: G.PolygonGeometry.fromPositions({
            positions: G.Cartesian3.fromDegreesArray([
              116.2, 39.8, 116.6, 39.8, 116.6, 40.1, 116.2, 40.1,
            ]),
            vertexFormat: G.MaterialAppearance.MaterialSupport.TEXTURED.vertexFormat,
          }),
        }),
        appearance: new G.MaterialAppearance({
          material: cesiumMat,
          translucent: true,
        }),
        asynchronous: false,
      }));
    }

    /* ── 原生 Cesium.MaterialProperty 透传 ── */
    function demoNative(type) {
      clearAll();
      let matProp;
      switch (type) {
        case 'dynamic': {
          // 动态颜色：每帧变化 HSL
          matProp = new G.ColorMaterialProperty(
            new G.CallbackProperty(() => {
              const hue = (Date.now() / 3000) % 1;
              return G.Color.fromHsl(hue, 1.0, 0.5, 0.7);
            }, false)
          );
          tip('动态颜色 MaterialProperty — 每帧改变色相');
          break;
        }
        case 'imageAnim': {
          matProp = new G.ImageMaterialProperty({
            image: 'https://cesium.com/downloads/cesiumjs/releases/1.117/Build/Cesium/Assets/Textures/checkerboard.png',
            repeat: new G.Cartesian2(4, 4),
            color: new G.CallbackProperty(() => {
              const alpha = 0.4 + 0.4 * Math.sin(Date.now() / 600);
              return new G.Color(1, 1, 1, alpha);
            }, false),
            transparent: true,
          });
          tip('图片 + 透明度动画 ImageMaterialProperty');
          break;
        }
      }
      graphicLayer.addGraphic(new G.PolygonGraphic({
        positions: POLY_POSITIONS,
        style: { material: matProp }   // 原生 MaterialProperty 透传
      }));
      graphicLayer.addGraphic(new G.CircleGraphic({
        position: CIRCLE_CENTER,
        style: { radius: 30000, material: matProp }
      }));
    }

    /* ── 初始展示 ── */
    demo('grid');

    /* ── 提示 ── */
    function tip(msg, duration = 4000) {
      const el = document.getElementById('tip');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(tipTimer);
      tipTimer = setTimeout(() => el.classList.remove('show'), duration);
    }
  </script>
</body>
</html>
