<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geoGlobe3D - 模拟地形（CustomHeightmapTerrainProvider）</title>
  <link rel="stylesheet" href="../dist/Widgets/widgets.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #mapContainer { width: 100%; height: 100%; overflow: hidden; }

    #toolbars {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .bar-group {
      background: rgba(20, 26, 36, 0.92);
      border-radius: 6px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 10px rgba(0,0,0,.45);
    }

    .bar-group .group-label {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      user-select: none;
    }

    .bar-group button {
      background: #2e3340;
      color: #ccc;
      border: 1px solid rgba(255,255,255,.1);
      padding: 5px 14px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      transition: background .15s, color .15s;
      font-family: 'Microsoft YaHei', sans-serif;
    }
    .bar-group button:hover  { background: #4a90d9; color: #fff; }
    .bar-group button.active { background: #4a90d9; color: #fff; border-color: #4a90d9; }

    #tip {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      background: rgba(0,0,0,.75);
      color: #4fc3f7;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 4px;
      pointer-events: none;
      transition: opacity .3s;
      opacity: 0;
      white-space: nowrap;
      font-family: 'Microsoft YaHei', sans-serif;
    }
    #tip.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="mapContainer"></div>

  <div id="toolbars">
    <!-- 地形切换 -->
    <div class="bar-group">
      <span class="group-label">🏔️ 地形</span>
      <button id="btnNoise"    onclick="setTerrain('noise')"    class="active">噪声地形</button>
      <button id="btnSine"     onclick="setTerrain('sine')">    正弦地形</button>
      <button id="btnEllipsoid" onclick="setTerrain('ellipsoid')">平坦椭球</button>
    </div>

    <!-- 显示控制 -->
    <div class="bar-group">
      <span class="group-label">🔧 控制</span>
      <button id="btnLight"   onclick="toggleLight()"   class="active">光照</button>
      <button id="btnWire"    onclick="toggleWire()">   线框</button>
      <button id="btnDepth"   onclick="toggleDepth()"   class="active">地形遮挡</button>
      <button id="btnToolbar" onclick="toggleToolbar()" class="active">状态栏</button>
      <button id="btnNavbar"  onclick="toggleNavbar()"  class="active">导航栏</button>
    </div>
  </div>

  <div id="tip"></div>

  <script src="../dist/geoglobe.min.js"></script>
  <script>
    /* ══════════════════════════════════════════════════
     *  从 geoGlobe 解构所需类（无需暴露完整 Cesium 命名空间）
     * ══════════════════════════════════════════════════ */
    const {
      CustomHeightmapTerrainProvider,
      EllipsoidTerrainProvider,
      Cartesian3,
      HeadingPitchRoll,
      Color
    } = geoGlobe;

    /* ══════════════════════════════════════════════════
     *  CustomHeightmapTerrainProvider 工具函数
     * ══════════════════════════════════════════════════ */
    const TILE_W = 32, TILE_H = 32;

    function fract(x) { return x - Math.floor(x); }
    function smoothstep(x) { return x * x * (3.0 - 2.0 * x); }
    function lerp(a, b, t) { return a * (1 - t) + b * t; }

    function hash(x, y) {
      const a = 50.0 * fract(x * 0.3183099 + 0.71);
      const b = 50.0 * fract(y * 0.3183099 + 0.113);
      return -1.0 + 2.0 * fract(a * b * (a + b));
    }

    function noise(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = fract(x),      fy = fract(y);
      const tx = smoothstep(fx), ty = smoothstep(fy);
      return lerp(
        lerp(hash(ix,     iy),     hash(ix + 1, iy),     tx),
        lerp(hash(ix,     iy + 1), hash(ix + 1, iy + 1), tx),
        ty
      );
    }

    function fbm(x, y) {
      let v  =  0.5      * noise(x *   1.0,  y *   1.0);
      v      += 0.25     * noise(x *   0.4,  y *   2.8);
      v      += 0.125    * noise(x *  -2.72, y *   4.96);
      v      += 0.0625   * noise(x * -10.3,  y *   4.67);
      v      += 0.03125  * noise(x * -22.09, y *  -4.89);
      v      += 0.015625 * noise(x * -29.48, y * -34.33);
      return v;  // -1 ~ +1
    }

    function terrainNoise(x, y) {
      return Math.pow(fbm(x, y) * 0.5 + 0.5, 2.0); // 0 ~ 1，尖峰化
    }

    /* ══════════════════════════════════════════════════
     *  建立三种地形 Provider
     * ══════════════════════════════════════════════════ */
    const noiseTerrainProvider = new CustomHeightmapTerrainProvider({
      width: TILE_W, height: TILE_H,
      callback(x, y, level) {
        const buf = new Float32Array(TILE_W * TILE_H);
        for (let yy = 0; yy < TILE_H; yy++) {
          for (let xx = 0; xx < TILE_W; xx++) {
            const u = (x + xx / (TILE_W - 1)) / Math.pow(2, level);
            const v = (y + yy / (TILE_H - 1)) / Math.pow(2, level);
            buf[yy * TILE_W + xx] = 9000 * terrainNoise(u * 1750 - 10, v * 1500);
          }
        }
        return buf;
      }
    });

    const sineTerrainProvider = new CustomHeightmapTerrainProvider({
      width: TILE_W, height: TILE_H,
      callback(x, y, level) {
        const buf = new Float32Array(TILE_W * TILE_H);
        for (let yy = 0; yy < TILE_H; yy++) {
          for (let xx = 0; xx < TILE_W; xx++) {
            const v = (y + yy / (TILE_H - 1)) / Math.pow(2, level);
            buf[yy * TILE_W + xx] = 4000 * (Math.sin(8000 * v) * 0.5 + 0.5);
          }
        }
        return buf;
      }
    });

    const ellipsoidProvider = new EllipsoidTerrainProvider();

    /* ══════════════════════════════════════════════════
     *  初始化地图（关闭 Ion 地形，使用噪声地形）
     * ══════════════════════════════════════════════════ */
    const map = new geoGlobe.GeoMap('mapContainer', {
      terrain: { enabled: false },   // 不加载 Ion 地形，手动指定
      scene: {
        globe: {
          depthTestAgainstTerrain: true,
          enableLighting: true
        }
      },
      control: {
        timeline:             false,
        animation:            false,
        baseLayerPicker:      false,
        homeButton:           false,
        sceneModePicker:      false,
        navigationHelpButton: false,
        fullscreenButton:     false,
        navBar:   true,
        toolbar:  true,
        navigation: {
          enableCompass:        false,
          enableZoomControls:   false,
          enableDistanceLegend: true
        }
      },
      camera: {
        position: [0, 40, 800000],
        heading: 0,
        pitch: -30,
        roll: 0
      }
    });

    // 初始化完成后手动设置噪声地形
    map.viewer.terrainProvider = noiseTerrainProvider;

    // 飞到适合观察地形的视角（贴近地表）
    map.viewer.camera.setView({
      destination: new Cartesian3(339907.19, 5654554.28, 2936259.01),
      orientation: new HeadingPitchRoll(5.474, -0.223, 6.283)
    });

    /* ══════════════════════════════════════════════════
     *  切换地形
     * ══════════════════════════════════════════════════ */
    const PROVIDERS = {
      noise:     { provider: noiseTerrainProvider,   label: '噪声地形（FBM 分形）' },
      sine:      { provider: sineTerrainProvider,    label: '正弦波地形' },
      ellipsoid: { provider: ellipsoidProvider,      label: '平坦椭球体（无地形）' }
    };

    let currentTerrain = 'noise';

    function setTerrain(key) {
      if (key === currentTerrain) return;
      currentTerrain = key;
      map.viewer.terrainProvider = PROVIDERS[key].provider;

      ['noise', 'sine', 'ellipsoid'].forEach(k => {
        document.getElementById('btn' + k.charAt(0).toUpperCase() + k.slice(1))
                .classList.toggle('active', k === key);
      });
      showTip('已切换：' + PROVIDERS[key].label);
    }

    /* ══════════════════════════════════════════════════
     *  控制开关
     * ══════════════════════════════════════════════════ */
    let lightOn = true;
    function toggleLight() {
      lightOn = !lightOn;
      map.viewer.scene.globe.enableLighting = lightOn;
      document.getElementById('btnLight').classList.toggle('active', lightOn);
      showTip('太阳光照：' + (lightOn ? '开启' : '关闭'));
    }

    let wireOn = false;
    function toggleWire() {
      wireOn = !wireOn;
      // GlobeSurfaceTileProvider._debug.wireframe 是 Cesium 内置线框开关
      const tileProvider = map.viewer.scene.globe._surface._tileProvider;
      tileProvider._debug.wireframe = wireOn;
      document.getElementById('btnWire').classList.toggle('active', wireOn);
      showTip('线框模式：' + (wireOn ? '开启' : '关闭'));
    }

    let depthOn = true;
    function toggleDepth() {
      depthOn = !depthOn;
      map.viewer.scene.globe.depthTestAgainstTerrain = depthOn;
      document.getElementById('btnDepth').classList.toggle('active', depthOn);
      showTip('地形遮挡：' + (depthOn ? '开启' : '关闭'));
    }

    let toolbarVisible = true;
    function toggleToolbar() {
      if (!map.toolbar) return;
      map.toolbar.toggle();
      toolbarVisible = !toolbarVisible;
      document.getElementById('btnToolbar').classList.toggle('active', toolbarVisible);
      showTip('底部状态栏：' + (toolbarVisible ? '显示' : '隐藏'));
    }

    let navbarVisible = true;
    function toggleNavbar() {
      if (!map.navBar) return;
      map.navBar.toggle();
      navbarVisible = !navbarVisible;
      document.getElementById('btnNavbar').classList.toggle('active', navbarVisible);
      showTip('左侧导航栏：' + (navbarVisible ? '显示' : '隐藏'));
    }

    /* ══════════════════════════════════════════════════
     *  提示
     * ══════════════════════════════════════════════════ */
    let tipTimer = null;
    function showTip(text, duration = 3500) {
      const el = document.getElementById('tip');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(tipTimer);
      tipTimer = setTimeout(() => el.classList.remove('show'), duration);
    }

    showTip('模拟地形已加载 — 移动鼠标查看底部海拔，切换地形类型', 5000);
  </script>
</body>
</html>
